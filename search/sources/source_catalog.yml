    priority: 1
    domain_tier: 1
    enabled: true
    access:
      mode: "partially_authenticated"
      authentication_required: true
    discovery_targets:
      - "advertised_research_position"
      - "undergraduate_project"
      - "internship"
      - "volunteer_opportunity"
      - "academic_credit_opportunity"
    preferred_subjects:
      - "computer_science"
      - "artificial_intelligence"
      - "data_science"
      - "bioinformatics"
      - "computer_vision"
      - "software_engineering"
    query_profiles:
      - "broad_academic_discovery"
      - "lab_and_project_discovery"
      - "advertised_roles"
      - "technical_specialization"
    extraction_method: "Search listings, then open each viable listing and its application route."
    institutional_scope_assumption: "Portal presence alone does not establish UCSD affiliation."
