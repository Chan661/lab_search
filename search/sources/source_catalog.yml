schema_version: "1.0"

ranking_policy:
  preferred_domains:
    - "computer_science"
    - "data_science"
    - "artificial_intelligence"
    - "bioinformatics"
  preferred_departments:
    - "Computer Science and Engineering"
    - "Halıcıoğlu Data Science Institute"
    - "Bioinformatics and Systems Biology"
  secondary_departments:
    - "Electrical and Computer Engineering"
    - "Bioengineering"
  result_scoring:
    preferred_domain_or_department: 4
    preferred_project_subject: 3
    substantial_computational_work: 2
    verified_undergraduate_participation: 2
    general_jacobs_engineering_lab: 0
    primarily_unrelated_physical_or_laboratory_work: -3
  expansion_rule: >-
    Search general Jacobs School and other engineering sources after preferred
    CSE, data science, AI, and bioinformatics sources. Investigate results from
    secondary departments only when the work is substantially computational or
    higher-priority sources produce too few viable leads.

query_profiles:
  broad_academic_discovery:
    terms:
      - "CSE"
      - "computer science"
      - "computing"
      - "data science"
      - "artificial intelligence"
      - "bioinformatics"
      - "computational"
      - "research"
      - "undergraduate research"
  lab_and_project_discovery:
    terms:
      - "lab"
      - "laboratory"
      - "research group"
      - "research project"
      - "faculty project"
      - "undergraduate project"
      - "student researcher"
      - "join our lab"
      - "research opportunities"
  advertised_roles:
    terms:
      - "research assistant"
      - "undergraduate research assistant"
      - "student research assistant"
      - "student assistant"
      - "programmer"
      - "software developer"
      - "data analyst"
      - "lab assistant"
  technical_specialization:
    terms:
      - "machine learning"
      - "computer vision"
      - "natural language processing"
      - "computational biology"
      - "biomedical informatics"
      - "data systems"
      - "backend"
      - "embedded systems"

